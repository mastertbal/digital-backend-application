spring.application.name=digital-backend-application

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.web.error.include-stacktrace=always

# JWT Configuration
jwt.secret.string=${JWT_SECRET}
jwt.expiration.time=${JWT_EXPIRATION_TIME}
jwt.refresh.expiration.time=${JWT_REFRESH_EXPIRATION_TIME}

security.encryption.password=${ENCRYPTION_PASSWORD}
security.encryption.salt=${ENCRYPTION_SALT}

# Email Notifications
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SMS Notification  Configurations
termii.api.key=${TERMII_API_KEY}
termii.sender.id=${SENDER_ID}
termii.base.url=${BASE_URL}

springdoc.swagger-ui.path=/swagger-ui.html

